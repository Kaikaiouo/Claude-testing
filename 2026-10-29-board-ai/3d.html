<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>立體棋盤</title>
<style>
  :root { --bg:#eef0ec; --panel:#dde2db; --fg:#1d2420; --accent:#a35d00; --ctl:#fff; --ctl-b:#b3bdb3; --stage:#cfd8cf; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#171b20; --panel:#232a31; --fg:#e8eaed; --accent:#f0b429; --ctl:#333c46; --ctl-b:#47525f; --stage:#10141a; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#171b20; --panel:#232a31; --fg:#e8eaed; --accent:#f0b429; --ctl:#333c46; --ctl-b:#47525f; --stage:#10141a; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,"Noto Sans TC",sans-serif; display:flex; flex-direction:column; align-items:center; padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size:1.2rem; margin:4px 0 12px; text-wrap:balance; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; background:var(--panel); padding:10px 12px; border-radius:10px; margin-bottom:12px; }
  select,button { background:var(--ctl); color:var(--fg); border:1px solid var(--ctl-b); border-radius:6px; padding:6px 10px; font-size:.9rem; cursor:pointer; }
  #stage { width:100%; max-width:920px; background:var(--stage); border-radius:10px; overflow:hidden; line-height:0; }
  #stage canvas { width:100%; display:block; cursor:grab; }
  #status { margin-top:12px; min-height:1.5em; font-size:1rem; color:var(--accent); text-align:center; font-weight:600; }
  #info { font-size:.85rem; opacity:.75; margin-top:4px; text-align:center; min-height:1.2em; }
  .bar .who { font-weight:600; }
  .board { width:100%; max-width:920px; margin-top:20px; background:var(--panel); border-radius:10px; padding:14px; }
  .board h2 { font-size:1rem; margin:0 0 10px; }
  .board .sel { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:520px; font-variant-numeric:tabular-nums; font-size:.9rem; }
  th,td { padding:6px 8px; text-align:center; border-bottom:1px solid var(--ctl-b); }
  th { font-size:.78rem; letter-spacing:.04em; opacity:.7; font-weight:600; }
  td.nm { text-align:left; font-weight:600; } th:nth-child(2) { text-align:left; }
  td.empty { text-align:center; opacity:.7; padding:18px 8px; }
  tr.me { background:color-mix(in srgb, var(--accent) 18%, transparent); }
  .overlay { position:fixed; inset:0; background:#000a; display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .overlay[hidden] { display:none; }
  .dlg { background:var(--bg); color:var(--fg); border-radius:12px; padding:20px; width:min(360px,100%); box-shadow:0 10px 40px #0008; }
  .dlg h2 { margin:0 0 6px; font-size:1.05rem; } .dlg p { margin:0 0 12px; font-size:.88rem; opacity:.75; }
  .dlg input { width:100%; padding:9px 10px; border-radius:6px; border:1px solid var(--ctl-b); background:var(--ctl); color:var(--fg); font-size:1rem; }
  .dlg .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .err { color:#d33; font-size:.82rem; min-height:1.1em; margin-top:6px; }
  .tip { font-size:.8rem; opacity:.65; margin-top:6px; text-align:center; }
</style>
</head>
<body>
<h1>立體棋盤</h1>
<div class="bar">
  <label>遊戲 <select id="game"><option value="score4">立體四連 4×4×4</option><option value="othello">黑白棋</option><option value="gomoku">五子棋</option></select></label>
  <label>你執 <select id="side"><option value="1">先手</option><option value="-1">後手</option></select></label>
  <label>難度 <select id="level"></select></label>
  <button id="new">新局</button>
  <button id="undo">悔棋</button>
  <button id="view">俯視 / 斜視</button>
  <button id="who" class="who">設定名稱</button>
</div>
<div id="stage"></div>
<div id="status"></div>
<div id="info"></div>
<div class="tip">拖曳旋轉視角・滾輪或雙指縮放・點擊落子・對局會自動保存,離開再回來可接續</div>
<section class="board">
  <h2>排行榜(勝 3 分、平 1 分;用過悔棋的局不列入)</h2>
  <div class="sel">
    <label>遊戲 <select id="lbGame"><option value="score4">立體四連</option><option value="othello">黑白棋</option><option value="gomoku">五子棋</option></select></label>
    <label>難度 <select id="lbLevel"></select></label>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>名次</th><th>玩家</th><th>勝</th><th>平</th><th>負</th><th>勝率</th><th>積分</th><th>最快獲勝</th></tr></thead>
    <tbody id="lbBody"></tbody>
  </table></div>
</section>
<div class="overlay" id="nameBox" hidden>
  <div class="dlg">
    <h2>你的玩家名稱</h2>
    <p>成績會用這個名稱記在排行榜上,下次回來會自動記得。</p>
    <input id="nameIn" maxlength="16" placeholder="例如:小凱" autocomplete="off">
    <div class="err" id="nameErr"></div>
    <div class="row"><button id="nameCancel">取消</button><button id="nameOk">開始</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/util.js"></script>
<script src="src/othello.js"></script>
<script src="src/gomoku.js"></script>
<script src="src/score4.js"></script>
<script src="src/search.js"></script>
<script src="app3d.js"></script>
</body>
</html>
