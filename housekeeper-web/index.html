<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>housekeeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* 版面:手機寬度的單欄 App。上方標題與摘要,中間清單,右下角新增鈕;表單以底部面板開啟 */
  :root {
    --bg:#f1f5f2; --surface:#ffffff; --fg:#16211b; --muted:#5b6a61; --line:#d8e1da; --brand:#1d7a58; --brand-fg:#ffffff;
    --expired:#c4302b; --expired-bg:#fbe5e3; --urgent:#cf6a0a; --urgent-bg:#fdebd6; --soon:#9a7a00; --soon-bg:#f8f0c9; --ok:#23805a; --ok-bg:#dff1e8;
    --shadow:0 2px 10px #1a2a2214;
    --display:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif; --body:"Noto Sans TC",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#111815; --surface:#1a2420; --fg:#e5eee8; --muted:#9bb0a4; --line:#2c3a33; --brand:#4fc79c; --brand-fg:#07251a;
    --expired:#ff8a84; --expired-bg:#4a1f1d; --urgent:#ffb15c; --urgent-bg:#47300f; --soon:#e9cf58; --soon-bg:#3d3510; --ok:#6fd6a6; --ok-bg:#18372b; --shadow:0 2px 10px #0006; color-scheme:dark; } }
  :root[data-theme="dark"] {
    --bg:#111815; --surface:#1a2420; --fg:#e5eee8; --muted:#9bb0a4; --line:#2c3a33; --brand:#4fc79c; --brand-fg:#07251a;
    --expired:#ff8a84; --expired-bg:#4a1f1d; --urgent:#ffb15c; --urgent-bg:#47300f; --soon:#e9cf58; --soon-bg:#3d3510; --ok:#6fd6a6; --ok-bg:#18372b; --shadow:0 2px 10px #0006; color-scheme:dark; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .app { max-width:560px; margin:0 auto; padding-block:16px 96px; }
  .layout { display:block; } .addwide { display:none; width:100%; padding:11px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  h1 { font-family:var(--display); font-size:1.5rem; margin:0; letter-spacing:.01em; }
  .sync { font-size:.75rem; color:var(--muted); }
  button { font-family:inherit; font-size:.9rem; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  button.primary { background:var(--brand); color:var(--brand-fg); border-color:var(--brand); font-weight:700; }
  button.danger { color:var(--expired); border-color:var(--expired); }
  button.ghost { border-color:transparent; background:transparent; color:var(--muted); }

  .banner { background:var(--urgent-bg); color:var(--urgent); border-radius:12px; padding:10px 14px; margin-bottom:12px; font-weight:500; }
  .banner.bad { background:var(--expired-bg); color:var(--expired); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--surface); border-radius:12px; padding:10px 6px; text-align:center; box-shadow:var(--shadow); }
  .stat b { display:block; font-family:var(--display); font-size:1.5rem; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat span { font-size:.72rem; color:var(--muted); letter-spacing:.04em; }
  .stat.expired b { color:var(--expired); } .stat.urgent b { color:var(--urgent); } .stat.soon b { color:var(--soon); } .stat.ok b { color:var(--ok); }

  .tools { display:flex; gap:8px; margin-bottom:10px; }
  .tools input { flex:1; min-width:0; }
  input, select, textarea { font-family:inherit; font-size:1rem; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 11px; width:100%; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; scrollbar-width:none; }
  .chip { flex:none; border-radius:999px; padding:5px 12px; font-size:.85rem; }
  .chip[aria-pressed="true"] { background:var(--brand); color:var(--brand-fg); border-color:var(--brand); }

  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:14px; padding:10px 12px 10px 10px; box-shadow:var(--shadow); }
  .badge { flex:none; width:60px; height:60px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--display); line-height:1.1; }
  .badge b { font-size:1.45rem; font-variant-numeric:tabular-nums; } .badge small { font-size:.68rem; font-family:var(--body); }
  .badge.expired { background:var(--expired-bg); color:var(--expired); } .badge.urgent { background:var(--urgent-bg); color:var(--urgent); }
  .badge.soon { background:var(--soon-bg); color:var(--soon); } .badge.ok { background:var(--ok-bg); color:var(--ok); }
  .info { flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; cursor:pointer; color:inherit; }
  .info .nm { font-weight:700; font-size:1rem; overflow-wrap:anywhere; }
  .info .meta { font-size:.8rem; color:var(--muted); overflow-wrap:anywhere; }
  .done-btn { flex:none; padding:8px 10px; }
  .empty { text-align:center; padding:36px 12px; color:var(--muted); }
  .empty h2 { font-family:var(--display); color:var(--fg); font-size:1.15rem; margin:0 0 6px; }
  .empty .actions { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  details.hist { margin-top:18px; } details.hist summary { cursor:pointer; color:var(--muted); font-size:.9rem; }
  details.hist .row { opacity:.8; margin-top:8px; } .row .acts { display:flex; gap:6px; flex:none; }

  .fab { position:fixed; right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); width:58px; height:58px; border-radius:50%; font-size:2rem; line-height:1; padding:0; box-shadow:0 6px 18px #0004; }

  .sheetwrap { position:fixed; inset:0; background:#0007; display:flex; align-items:flex-end; justify-content:center; z-index:30; }
  .sheetwrap[hidden] { display:none; }
  .sheet { background:var(--bg); width:min(560px,100%); max-height:92vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet h2 { font-family:var(--display); margin:0 0 12px; font-size:1.2rem; }
  .field { margin-bottom:12px; } .field > label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:4px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qty { display:flex; align-items:center; gap:8px; } .qty input { text-align:center; width:64px; } .qty button { width:42px; padding:8px 0; }
  .opened { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; } .opened button { padding:4px 10px; font-size:.8rem; border-radius:999px; } .opened .note { font-size:.8rem; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; } .quick button { padding:4px 10px; font-size:.8rem; border-radius:999px; }
  .check { display:flex; align-items:center; gap:8px; font-size:.9rem; margin-top:6px; } .check input { width:auto; }
  .scanbox button { width:100%; padding:10px; border-style:dashed; } .scanbox .note { margin-top:4px; } #scanThumb { display:block; margin-top:8px; max-height:120px; max-width:100%; border-radius:10px; object-fit:cover; }
  .errs { color:var(--expired); font-size:.85rem; margin-bottom:8px; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; } .btns .grow { margin-right:auto; }
  .hbtns { display:flex; gap:6px; } .hbtns button { white-space:nowrap; }
  @media (max-width: 440px) { .hbtns button { padding:8px 9px; font-size:.82rem; } .hbtns { gap:4px; } }
  .bars { display:flex; flex-direction:column; gap:6px; margin:8px 0 14px; }
  .bar { display:grid; grid-template-columns:4.5em 1fr 2em; align-items:center; gap:8px; font-size:.85rem; }
  .bar i { display:block; height:10px; border-radius:6px; background:var(--brand); min-width:4px; } .bar em { font-style:normal; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
  .big { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0 14px; }
  .big div { background:var(--surface); border-radius:12px; padding:10px 6px; text-align:center; box-shadow:var(--shadow); } .big b { display:block; font-family:var(--display); font-size:1.4rem; } .big span { font-size:.72rem; color:var(--muted); }
  .note { font-size:.8rem; color:var(--muted); }
  .shoprow { padding:8px 10px; } .shopname { flex:1; min-width:0; display:flex; align-items:center; gap:10px; cursor:pointer; min-height:44px; }
  .shopname input { width:22px; height:22px; flex:none; accent-color:var(--brand); } .shopname .nm { font-weight:500; overflow-wrap:anywhere; }
  .shopgrp { font-size:.85rem; color:var(--muted); margin:12px 0 4px; font-weight:700; }
  .shoprow.bought .nm { text-decoration:line-through; color:var(--muted); }
  .shopadd { display:flex; gap:8px; margin-top:12px; } .shopadd input { flex:1; min-width:0; }
  .snack { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom, 0px)); z-index:40; background:var(--fg); color:var(--bg); border-radius:12px; padding:8px 8px 8px 14px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px #0005; max-width:calc(100vw - 32px); font-size:.9rem; }
  .snack[hidden] { display:none; } .snack button { color:var(--bg); font-weight:700; border-color:var(--bg); white-space:nowrap; background:transparent; }

  /* ---- 響應式:依螢幕寬度調整版型 ---- */
  /* 小手機(≤360px):縮小間距與徽章,摘要改兩欄 */
  @media (max-width: 360px) {
    body { font-size:14px; } h1 { font-size:1.3rem; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .badge { width:52px; height:52px; } .badge b { font-size:1.2rem; }
    .row { gap:8px; padding:8px; } .two { grid-template-columns:1fr; }
    .done-btn { padding:6px 8px; }
  }
  /* 手機橫放(高度很矮):底部面板改成可捲動、縮小上下間距 */
  @media (max-height: 480px) and (orientation: landscape) {
    .app { max-width:760px; padding-block:8px 80px; } .sheet { max-height:96vh; padding-block:10px; } .stats { margin-bottom:8px; }
  }
  /* 平板(≥720px):左側摘要與篩選、右側清單兩欄;面板改為置中對話框 */
  @media (min-width: 720px) {
    body { font-size:16px; }
    .app { max-width:1040px; padding-block:24px 48px; }
    .layout { display:grid; grid-template-columns:300px minmax(0,1fr); gap:20px; align-items:start; }
    .side { position:sticky; top:16px; display:flex; flex-direction:column; gap:12px; }
    .side .stats { grid-template-columns:repeat(2,1fr); margin:0; } .side .tools { margin:0; }
    .chips { flex-wrap:wrap; overflow:visible; margin:0; padding:0; }
    .addwide { display:block; } .fab { display:none; }
    .sheetwrap { align-items:center; padding:24px; } .sheet { border-radius:18px; width:min(620px,100%); max-height:88vh; }
  }
  /* 螢幕很矮(手機橫放):側欄比螢幕高,不固定、隨頁面捲動 */
  @media (min-width: 720px) and (max-height: 600px) { .side { position:static; } }
  /* 桌機(≥1100px):清單改兩欄卡片 */
  @media (min-width: 1100px) {
    .app { max-width:1240px; }
    .layout { grid-template-columns:320px minmax(0,1fr); }
    ul.list#list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } ul.list#list .empty { grid-column:1 / -1; }
  }
  @media (prefers-reduced-motion: no-preference) { .row { transition:transform .12s; } .row:hover { transform:translateY(-1px); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>housekeeper</h1><div class="sync" id="sync">載入中…</div></div>
    <div class="hbtns"><button id="btnShop">購物清單</button><button id="btnStats">統計</button><button id="btnSettings" aria-label="設定">設定</button></div>
  </header>
  <div id="banner"></div>
  <div class="layout">
    <aside class="side">
      <div class="stats" id="stats"></div>
      <div class="tools"><input id="search" type="search" placeholder="搜尋名稱、類別、備註" aria-label="搜尋"></div>
      <div class="chips" id="chips"></div>
      <button class="addwide primary" id="addWide" type="button">+ 新增物品</button>
    </aside>
    <main class="main">
      <ul class="list" id="list"></ul>
      <details class="hist" id="hist"><summary id="histSum"></summary><ul class="list" id="histList"></ul></details>
    </main>
  </div>
</div>
<button class="fab primary" id="fab" aria-label="新增物品">+</button>

<div class="sheetwrap" id="formWrap" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <h2 id="formTitle">新增物品</h2>
  <div class="errs" id="formErrs"></div>
  <div class="field scanbox" id="scanBox" hidden><button type="button" id="scanBtn">📷 拍照/選圖辨識</button><input id="scanFile" type="file" accept="image/*" capture="environment" hidden><img id="scanThumb" alt="已選取的包裝照片預覽" hidden><div class="note" id="scanMsg" role="status" aria-live="polite">拍下包裝,由 Claude 讀出品名與有效日期(會使用你的 Claude 額度,結果請再確認)。</div></div>
  <div class="field"><label for="fName">名稱</label><input id="fName" maxlength="40" placeholder="例如:鮮奶" autocomplete="off"></div>
  <div class="two">
    <div class="field"><label for="fCat">類別</label><select id="fCat"></select></div>
    <div class="field"><label>數量</label><div class="qty"><button type="button" id="qMinus" aria-label="減少">−</button><input id="fQty" type="number" min="1" max="99" value="1" inputmode="numeric"><button type="button" id="qPlus" aria-label="增加">+</button></div></div>
  </div>
  <div class="field" id="milkRow" hidden><label>牛奶種類</label><div class="quick" id="milkQuick"></div></div>
  <div class="two">
    <div class="field"><label for="fLoc">存放位置</label><select id="fLoc"></select></div>
    <div class="field"><label for="fTemp">存放溫度 °C(可空)</label><input id="fTemp" type="number" step="0.5" inputmode="decimal"></div>
  </div>
  <div class="two">
    <div class="field"><label for="fPurchase">購買日</label><input id="fPurchase" type="date"></div>
    <div class="field"><label for="fMfg">製造日期(可空)</label><input id="fMfg" type="date"></div>
  </div>
  <div class="field"><label for="fExpiry">到期日</label><input id="fExpiry" type="date">
    <div class="quick" id="quick"></div>
    <div class="opened" id="openedRow" hidden><button type="button" id="fOpen">已開封:縮短到期日</button><span id="openedMsg" class="note"></span></div>
    <label class="check"><input id="fEst" type="checkbox">到期日是估算值(包裝沒有標示)</label>
  </div>
  <div class="field"><label for="fOpenDays">開封後幾天內吃完(可空)</label><input id="fOpenDays" type="number" min="1" max="365" inputmode="numeric" placeholder="例如保久乳填 7;空白依類別估算"></div>
  <div class="field"><label for="fNotes">備註</label><textarea id="fNotes" rows="2" maxlength="300"></textarea></div>
  <div class="btns"><button id="fDelete" class="danger grow" hidden>刪除</button><button id="fCancel">取消</button><button id="fSave" class="primary">儲存</button></div>
</div></div>

<div class="sheetwrap" id="shopWrap" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <h2 id="shopTitle">購物清單</h2>
  <div id="shopBody"></div>
  <form class="shopadd" id="shopAdd"><input id="shopName" maxlength="40" placeholder="要買什麼?" aria-label="新增購物項目" autocomplete="off"><button class="primary" type="submit">加入</button></form>
  <div class="btns"><button id="shopClose" class="primary" type="button">關閉</button></div>
</div></div>

<div class="snack" id="snack" role="status" aria-live="polite" hidden></div>

<div class="sheetwrap" id="statWrap" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="statTitle">
  <h2 id="statTitle">統計</h2>
  <div id="statBody"></div>
  <div class="btns"><button id="statClose" class="primary">關閉</button></div>
</div></div>

<div class="sheetwrap" id="setWrap" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <h2 id="setTitle">設定</h2>
  <div class="two">
    <div class="field"><label for="sDays">到期前幾天提醒</label><input id="sDays" type="number" min="0" max="60" inputmode="numeric"></div>
    <div class="field"><label for="sHour">提醒時間(整點)</label><select id="sHour"></select></div>
  </div>
  <p class="note">網頁版無法像 App 一樣在背景推播。這裡改用兩種方式:打開頁面時上方會顯示需要處理的物品;也可以匯出行事曆檔,匯入 iPhone 或 Google 行事曆後由行事曆提醒。</p>
  <div class="field"><button id="sExport">匯出到期提醒行事曆(.ics)</button><div class="note" id="exportMsg"></div></div>
  <div class="field"><button id="sBackup">備份資料(.json)</button> <button id="sRestore">從備份還原</button><input id="sFile" type="file" accept=".json,application/json" hidden><div class="note" id="backupMsg">還原會與目前清單合併,相同項目以備份檔為準。</div></div>
  <div class="field"><button id="sSample">載入範例資料</button> <span class="note">範例會加入清單,可自行刪除。</span></div>
  <div class="btns"><button id="sClose" class="primary">完成</button></div>
</div></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
